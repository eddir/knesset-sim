<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Симулятор Кнессета: выборы 27 октября 2026 года. Ответы собирают 120 мандатов, барьер 3,25% и коалицию на 61 место." />
    <title>Симулятор Кнессета · 2026</title>
    <script>
      try {
        var theme = localStorage.getItem('knesset-theme')
        if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
